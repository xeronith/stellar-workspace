name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version, build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine next version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            range="HEAD"
            base="0.0.0"
          else
            range="${latest_tag}..HEAD"
            base="${latest_tag#v}"
          fi

          if [[ -z "$(git log "$range" --oneline)" ]]; then
            echo "No commits since ${latest_tag:-the first commit}. Nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log="$(git log "$range" --pretty=format:'%s%n%b%n--COMMIT--')"

          bump=""
          if grep -qiE 'BREAKING[ -]CHANGE:' <<< "$log" || grep -qiE '^[a-z]+(\([^)]*\))?!:' <<< "$log"; then
            bump="major"
          elif grep -qiE '^feat(\([^)]*\))?:' <<< "$log"; then
            bump="minor"
          elif grep -qiE '^(fix|perf|revert)(\([^)]*\))?:' <<< "$log"; then
            bump="patch"
          fi

          if [[ -z "$bump" ]]; then
            echo "No release-worthy conventional commits (feat, fix, perf, revert, breaking)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major minor patch <<< "$base"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version ($bump bump)"

      - name: Type-check
        if: steps.release.outputs.skip != 'true'
        run: npm run check

      - name: Set package version
        if: steps.release.outputs.skip != 'true'
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version

      - name: Build VSIX
        if: steps.release.outputs.skip != 'true'
        run: npm run package

      - name: Commit version, tag and push
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish GitHub release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: "*.vsix"
          fail_on_unmatched_files: true
